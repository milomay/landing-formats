<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Иконка вкладки. «К» — первый контур логотипа Кинопоиска из
       assets/img/logo-kinopoisk.svg, вырезан как есть, без перерисовки.
       Плитка брендовая оранжевая: на вкладке иконка стоит на фоне браузера,
       а он бывает и светлый, и тёмный, поэтому своя подложка обязательна.
       Скругление 8 из 32 — та же ступень шкалы, что у плашек на странице.
       Буква занимает 22 из 32 по высоте: у неё тонкие лучи, и с меньшей
       буквой они на вкладке в 16 пикселей смазывались в пятно.
       Растровые версии рядом собирает tools/favicon.py, руками не правим. -->
